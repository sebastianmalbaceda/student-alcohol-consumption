name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify data files exist
        run: |
          test -f data/raw/archive/student-mat.csv
          test -f data/raw/archive/student-por.csv

      - name: Data pipeline (genera data/processed para tests y validación)
        run: python scripts/run_pipeline.py --phase data
        env:
          PYTHONIOENCODING: utf-8

      - name: Train final model (genera models/ para tests de API)
        run: python scripts/run_pipeline.py --phase models
        env:
          PYTHONIOENCODING: utf-8

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Compile check (syntax)
        run: python -m compileall -q src scripts tests

      - name: Validate processed split (662 alumnos)
        run: |
          python -c "import pandas as pd; \
          n=sum(len(pd.read_csv(f'data/processed/{k}.csv')) for k in ['X_train','X_val','X_test']); \
          assert n==662, f'split total {n} != 662'"
